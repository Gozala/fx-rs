[workspace]
resolver = "2"
members = ["fx", "fx-macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/fx-rs"
keywords = ["effects", "algebraic-effects", "capabilities"]
categories = ["rust-patterns"]

[workspace.dependencies]
fx = { path = "fx" }
fx-macros = { path = "fx-macros" }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "visit-mut"] }
tokio = { version = "1.0", features = ["rt", "macros"] }
